    <script>
      (function() {
        // Prevent "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var origFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
          var fetchStorage = origFetch;

          // Ensure prototype allows assignment if defined there
          if (typeof Window !== 'undefined' && Window.prototype) {
            var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (protoDesc && !protoDesc.set && protoDesc.configurable) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() { return fetchStorage; },
                set: function(fn) { fetchStorage = fn; },
                configurable: true,
                enumerable: true
              });
            }
          }

          // Ensure window allows assignment
          var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!winDesc || winDesc.configurable) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return fetchStorage; },
              set: function(fn) { fetchStorage = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}

        // Global error guard to prevent harmless getter errors from bubbling
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
